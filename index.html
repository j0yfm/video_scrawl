.skin > *{position:absolute}

/* blue LCD buttons */
.lb{display:block}
.lb .scr{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:.2cqw;padding:0 1.2cqw;
  color:var(--blue-ink);font-size:2.7cqw;line-height:.9;text-shadow:0 0 .8cqw var(--blue-glow);
  border-radius:.4cqw;overflow:hidden;text-align:left;white-space:nowrap}
.lb .k{opacity:.7}
.lb .v{font-size:3.2cqw}
.lb .x{font-size:2.4cqw;opacity:.75}
.lb[aria-pressed="true"] .scr{background:var(--blue-lit);color:#0b1230;text-shadow:none}
.lb[aria-pressed="true"] .k{opacity:.8}
.lb.down .scr{background:rgba(120,150,255,.28)}
.lb[aria-pressed="true"].down .scr{background:#7a92ef}

/* olive LCD sliders */
.sl{touch-action:none;cursor:ns-resize}
.sl.h{cursor:ew-resize}
.sl .scr{position:absolute;overflow:hidden;border-radius:.3cqw}
.sl .fill{position:absolute;left:0;right:0;bottom:0;
  background:repeating-linear-gradient(0deg,var(--olive-fill) 0 .55cqw,transparent .55cqw .75cqw)}
.sl.h .fill{top:0;bottom:0;left:0;right:auto;
  background:repeating-linear-gradient(90deg,var(--olive-fill) 0 .55cqw,transparent .55cqw .75cqw)}
.sl .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1.2cqw;
  color:var(--olive-ink);font-size:3.3cqw;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.sl.v .txt{writing-mode:vertical-rl;transform:rotate(180deg)}
.sl.h .txt{font-size:3.7cqw}

/* display */
.stage{background:#000;overflow:hidden;touch-action:none;border-radius:.4cqw}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage .tag{position:absolute;top:1cqw;left:1.4cqw;font-size:2.8cqw;color:#fff;opacity:.55;pointer-events:none}
.stage .hint{position:absolute;left:0;right:0;bottom:2cqw;text-align:center;font-size:3.2cqw;color:#fff;opacity:.8;
  pointer-events:none;text-shadow:0 1px 2px #000}
.stage .msg{position:absolute;inset:0;display:grid;place-items:center;padding:4cqw;text-align:center;font-size:3.6cqw;color:#fff}
.pb{display:block;border-radius:1cqw}
.pb.down{background:rgba(0,0,0,.25);transform:translateY(.3cqw)}
.fsbtn{display:block;z-index:2;border-radius:1.5cqw}
.fsbtn:active{background:rgba(0,0,0,.18)}
body.fs .fsbtn{display:none}
.exit{display:none}

/* fullscreen mode: the display fills the screen, still drawable */
body.fs{background:#000}
body.fs .stage{position:fixed!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%);
  width:min(100vw, 100vh * 9 / 16)!important;height:min(100vh, 100vw * 16 / 9)!important;
  width:min(100vw, 100dvh * 9 / 16)!important;height:min(100dvh, 100vw * 16 / 9)!important;
  z-index:10;border-radius:0}
body.fs .stage .tag{font-size:12px;top:8px;left:10px}
body.fs .stage .hint{font-size:14px}
body.fs .exit{display:block;position:fixed;z-index:11;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;
  font-family:var(--lcd);font-size:18px;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.4);
  border-radius:4px;padding:4px 10px}

.toast{position:fixed;left:16px;right:16px;top:40%;max-width:360px;margin:0 auto;z-index:20;
  background:#0f1636;color:var(--blue-ink);border:1px solid #4f6fe0;border-radius:4px;padding:10px 12px;
  font-family:var(--lcd);font-size:18px;line-height:1.2;text-shadow:0 0 6px var(--blue-glow)}
</style>

</head>
<body>
<div class="skin" id="skin">
  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <span class="tag">9:16</span>
    <span class="hint" id="hint">DRAW TO PAINT L2</span>
  </div>
  <button class="fsbtn" id="fsBtn" aria-label="Fullscreen display"></button>
</div>
<button class="exit" id="exitBtn">EXIT</button>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="file" accept="video/*" hidden>

<script>
(() => {
'use strict';
const N = 48, RW = 240, RH = 426, MW = 270, MH = 480, OW = 540, OH = 960, CAP_MS = 1000 / 24;
const P = { size:.15, soft:0, fade:0, fb:0, d0:0, d1:.3, d2:.6, flip:.35, key:.5, motion:0,
            blend:0, paint:0, time:false, mirror:true };
const ord = [0, 1, 2]; // ord[position] = slot index. Position 0 = L1 base, 1 = L2, 2 = L3
const $ = id => document.getElementById(id);

/* ---------- skin geometry (pixels in the 698x1217 skin image) ---------- */
const SW = 698, SH = 1217, OX = 288, OY = 500; // measured on the original 1206x2144 image, minus crop origin
const R = (x0, y0, x1, y1) => [x0 - OX, y0 - OY, x1 - OX, y1 - OY];
const GEO = {
  stage: R(415, 628, 864, 1419),
  fs: R(769, 1519, 957, 1708), // the green PLU key
  loads: [R(466,512,511,608), R(677,512,722,608), R(885,510,935,606)],
  top: [R(321,538,436,600), R(539,536,648,596), R(749,535,860,595)],
  bot: [R(336,1550,441,1608), R(481,1549,588,1607), R(628,1550,735,1607), R(335,1635,441,1692), R(481,1634,589,1692), R(630,1634,737,1692)],
  left: [R(312,680,342,824), R(317,896,348,1043), R(319,1132,348,1271), R(328,1362,358,1506)],
  right: [R(904,646,934,791), R(910,866,943,1024), R(907,1103,940,1259), R(908,1343,939,1494)],
  under: [R(428,1475,590,1509), R(674,1469,843,1504)],
};
const STAGE_X0 = GEO.stage[0], STAGE_X1 = GEO.stage[2];
function place(el, r) {
  el.style.left = r[0] / SW * 100 + '%'; el.style.top = r[1] / SH * 100 + '%';
  el.style.width = (r[2] - r[0]) / SW * 100 + '%'; el.style.height = (r[3] - r[1]) / SH * 100 + '%';
}
function inner(el, hit, scr) { // place screen inside its hit box, in % of the hit box

}

/* ---------- drawing ---------- */
const stamps = [];
let lastPt = null, wakeLock = null, firstDraw = true;
function brush(e) {
  let r = 0.0012 + P.size * P.size * 0.24, w = 0.25;
  if (e && e.pointerType === 'pen' && e.pressure > 0) { r *= 0.4 + 0.8 * e.pressure; w *= Math.min(1.6, e.pressure * 1.6); }
  const ch = P.time ? 2 : P.paint === 2 ? 3 : P.paint;
  return { r, w: Math.min(w, 1.99) + ch * 2 };
}
function ptOf(e) {
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX - r.left) / r.width, y:1 - (e.clientY - r.top) / r.height };
}
function segment(a, b, br) {
  const dx = (b.x - a.x) * 0.5625, dy = b.y - a.y, d = Math.hypot(dx, dy);
  const n = Math.min(64, Math.max(1, Math.ceil(d / Math.max(br.r * 0.35, 0.0012))));
  for (let k = 1; k <= n; k++) { const t = k / n; stamps.push(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, br.r, br.w); }
}
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); e.preventDefault();
  if (firstDraw) { firstDraw = false; hint.hidden = true; }
  if (!wakeLock && navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { wakeLock = l; l.addEventListener('release', () => { wakeLock = null; }); }).catch(() => {});
  lastPt = ptOf(e); const br = brush(e); stamps.push(lastPt.x, lastPt.y, br.r, br.w);
});
canvas.addEventListener('pointermove', e => {
  if (!lastPt || !canvas.hasPointerCapture(e.pointerId)) return;
  const p = ptOf(e); segment(lastPt, p, brush(e)); lastPt = p;
});
const endStroke = () => { lastPt = null; };
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);

/* ---------- frame loop ---------- */
const stBuf = new Float32Array(512);
let lastCap = performance.now(), lastT = performance.now(), decAcc = 0;
clearAll();

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  camTick(now);
  if (now - lastCap >= CAP_MS) {
    lastCap = now - lastCap > 250 ? now : lastCap + CAP_MS;
    capture(now); refreshChips();
  }
  computeBases();

  // mask: fade + new brush stamps
  const T = fadeT(P.fade); let dec = 0;
  if (T !== Infinity) { decAcc += dt / T; const steps = Math.floor(decAcc * 255); decAcc -= steps / 255; dec = steps / 255; }
  const count = Math.min(128, stamps.length / 4);
  stBuf.fill(0); for (let k = 0; k < count * 4; k++) stBuf[k] = stamps[k];
  stamps.splice(0, count * 4);
  gl.useProgram(pMask);
  into(mask[1 - mCur], MW, MH);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, mask[mCur]);
  gl.uniform1i(pMask.u.uPrev, 3);
  gl.uniform4fv(pMask.u.uSt, stBuf); gl.uniform1i(pMask.u.uCount, count);
  gl.uniform1f(pMask.u.uDecay, dec); gl.uniform1f(pMask.u.uSoft, P.soft);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  mCur = 1 - mCur;

  // composite
  gl.useProgram(pComp);
  into(out[1 - oCur], OW, OH);
  slots.forEach((s, i) => { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D_ARRAY, s.ring); });
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, mask[mCur]);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, out[oCur]);
  const u = pComp.u;
  gl.uniform1i(u.uR0, 0); gl.uniform1i(u.uR1, 1); gl.uniform1i(u.uR2, 2);
  gl.uniform1i(u.uMask, 3); gl.uniform1i(u.uPrev, 4);
  gl.uniform3f(u.uBase, slots[0].base, slots[1].base, slots[2].base);
  gl.uniform3f(u.uBack, slots[0].back, slots[1].back, slots[2].back);
  gl.uniform1f(u.uN, N);
  gl.uniform3i(u.uOrd, ord[0], ord[1], ord[2]);
  gl.uniform1i(u.uBlend, P.blend);
  gl.uniform1f(u.uFb, P.fb); gl.uniform1f(u.uKey, P.key);
  gl.uniform1f(u.uMotion, P.motion < .01 ? 0 : P.motion);
  gl.uniform1f(u.uTimeMax, P.time ? N - 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  oCur = 1 - oCur;

  // present
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(pShow);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, out[oCur]);
  gl.uniform1i(pShow.u.uTex, 4);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
requestAnimationFrame(frame);
})();
</script>
